name: Lembretes de reunião

# Uma vez por dia. Não é aqui que os lembretes são enviados — eles já estão na
# fila da própria UAZAPI, agendados no momento em que a reunião foi marcada.
# Esta execução só reconcilia: refaz agendamento que falhou, desmarca o que
# ficou órfão e alcança reuniões que entraram no horizonte.
#
# Roda depois do sync-calendar (04:00 UTC) para já ver as mudanças vindas do
# Google no mesmo dia.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/meeting-reminders.yml"
      - "src/app/api/cron/meeting-reminders/route.ts"
      - "src/lib/meeting-reminders.ts"
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Execuções não se sobrepõem; se uma demorar, a próxima espera em vez de
# concorrer pela mesma reunião.
concurrency:
  group: meeting-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar identidade assinada do GitHub
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('f3f-task-meeting-reminders')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Reconciliar lembretes agendados
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://task.agenciaf3f.com.br/api/cron/meeting-reminders"
