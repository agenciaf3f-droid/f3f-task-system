name: Sincronizar clientes

on:
  # Também valida o fluxo quando a própria integração é alterada na main.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-clients.yml"
      - "src/app/api/cron/sync-clients/route.ts"
      - "src/lib/client-sheet-sync.ts"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      merge_name_duplicates:
        description: "Unir variantes de nome comprovadas pela planilha"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-clients
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar identidade assinada do GitHub
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('f3f-task-client-sync')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Sincronizar planilha com o Task
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          MERGE_NAME_DUPLICATES: ${{ inputs.merge_name_duplicates || false }}
        run: |
          URL="https://task.agenciaf3f.com.br/api/cron/sync-clients"
          if [ "${MERGE_NAME_DUPLICATES}" = "true" ]; then
            URL="${URL}?mergeNameDuplicates=1"
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            "${URL}"
